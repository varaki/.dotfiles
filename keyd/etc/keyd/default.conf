[ids]
*
# Exclude White Shark Hector mouse to prevent keyd from grabbing its button events
-1bcf:08b8

# Common config
[main]
# Capslock is Esc, navigation layer if it's kept pressed down
capslock = overload(navigation_layer, esc)
# Esc is 0
esc = `
# Microsoft Copilot button is Right Control
leftmeta+leftshift+f23 = layer(control)

[navigation_layer]
h = left
k = up
j = down
l = right
backspace = delete

# # White Shark Shinobi
# rightalt = left
# / = up
# compose = down
# rightcontrol = right
