# kitty config mirroring ~/.config/alacritty/alacritty.toml
include colors/gruvbox-dark-hard.conf

# Login shell is bash; run zsh (same as Alacritty launcher: --command /usr/bin/zsh)
shell /usr/bin/zsh

# --- Font -------------------------------------------------------------------
font_family      family="JetBrainsMono Nerd Font" style=Regular
bold_font        family="JetBrainsMono Nerd Font" style=Bold
italic_font      family="JetBrainsMono Nerd Font" style=Italic
bold_italic_font family="JetBrainsMono Nerd Font" style="Bold Italic"
font_size 11.5

# --- Window -----------------------------------------------------------------
# decorations = "none"
hide_window_decorations yes
# opacity = 0.97 (background only, like Alacritty)
background_opacity 0.97
# dimensions 130x40 cells
remember_window_size  no
initial_window_width  130c
initial_window_height 40c
# padding 5px (kitty uses pt: 5px = 3.75pt at 96 DPI)
window_padding_width 3.75
placement_strategy top-left

# --- Alacritty default behaviour -------------------------------------------
scrollback_lines 10000
cursor_shape block
cursor_blink_interval 0
cursor_trail 0
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell no
confirm_os_window_close 0
mouse_hide_wait 0
url_style none
detect_urls no
update_check_interval 0

# --- Keyboard: only Alacritty's default bindings + your custom one ----------
# (drops kitty's own ctrl+shift window/tab shortcuts)
clear_all_shortcuts yes
map ctrl+shift+c       copy_to_clipboard
map ctrl+shift+v       paste_from_clipboard
map shift+insert       paste_from_selection
map ctrl+insert        copy_to_clipboard
map ctrl+equal         change_font_size all +1.0
map ctrl+plus          change_font_size all +1.0
map ctrl+kp_add        change_font_size all +1.0
map ctrl+shift+plus    change_font_size all +1.0
map ctrl+minus         change_font_size all -1.0
map ctrl+kp_subtract   change_font_size all -1.0
map ctrl+0             change_font_size all 0
map shift+page_up      scroll_page_up
map shift+page_down    scroll_page_down
map shift+home         scroll_home
map shift+end          scroll_end
map ctrl+shift+n       new_os_window
# kitty has no live reload; this reloads the config (kitty default binding)
map ctrl+shift+f5      load_config_file
